<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaDesk · GraphRAG 智能客服</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="bg-orb bg-orb-a"></div>
  <div class="bg-orb bg-orb-b"></div>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <div class="brand-name">NovaDesk</div>
          <div class="brand-sub">GraphRAG CS Agent · Neo4j</div>
        </div>
      </div>
      <div class="status-pills" id="statusPills">
        <span class="pill" id="pillNeo">Neo4j …</span>
        <span class="pill" id="pillLlm">LLM …</span>
        <span class="pill" id="pillEmb">Emb …</span>
      </div>
    </header>

    <main class="layout">
      <section class="panel chat-panel">
        <div class="panel-head">
          <h1>智能客服小舟</h1>
          <p>混合检索（向量 + 关键词 + 图谱扩展）· LangGraph 工具调用</p>
        </div>
        <div class="messages" id="messages"></div>
        <form class="composer" id="chatForm">
          <input id="chatInput" type="text" placeholder="例如：Pro 套餐的 SLA 是多少？退款政策怎么算？" autocomplete="off" required />
          <button type="submit" id="sendBtn">发送</button>
        </form>
        <div class="quick">
          <button type="button" data-q="NovaDesk 有哪些核心模块？">产品模块</button>
          <button type="button" data-q="登录失败怎么排查？">登录失败</button>
          <button type="button" data-q="退款政策和数据保留多久？">退款政策</button>
          <button type="button" data-q="Enterprise 的 SLA 首响是多久？">SLA</button>
        </div>
      </section>

      <aside class="side">
        <section class="panel">
          <div class="panel-head">
            <h2>知识库状态</h2>
            <p>写入 Neo4j 的 Document / Chunk / Entity</p>
          </div>
          <div class="stats" id="stats">
            <div class="stat"><span>Documents</span><strong id="statDocs">-</strong></div>
            <div class="stat"><span>Chunks</span><strong id="statChunks">-</strong></div>
            <div class="stat"><span>Entities</span><strong id="statEntities">-</strong></div>
            <div class="stat"><span>Relations</span><strong id="statRels">-</strong></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>入库新知识</h2>
            <p>实时切分、向量化、实体抽取入图</p>
          </div>
          <form class="ingest" id="ingestForm">
            <input name="title" placeholder="标题" required />
            <textarea name="content" rows="5" placeholder="粘贴 FAQ / 政策 / 产品说明…" required></textarea>
            <button type="submit">写入 Neo4j</button>
            <p class="hint" id="ingestHint"></p>
          </form>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>图谱实体 Top</h2>
            <p>按关联度排序</p>
          </div>
          <ul class="entity-list" id="entityList"></ul>
        </section>
      </aside>
    </main>
  </div>
  <script src="/assets/app.js"></script>
</body>
</html>
