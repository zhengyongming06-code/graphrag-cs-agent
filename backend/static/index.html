<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识库客服</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="top">
    <div>
      <strong>知识库客服</strong>
      <span class="dim">文档检索问答</span>
    </div>
    <nav class="tabs">
      <button type="button" class="on" data-tab="chat">对话</button>
      <button type="button" data-tab="tickets">工单</button>
      <button type="button" data-tab="debug">调试</button>
    </nav>
    <div class="status">
      <span id="pillNeo">Neo4j …</span>
      <span id="pillLlm">LLM …</span>
    </div>
  </header>

  <main id="tab-chat" class="page">
    <section class="chat">
      <div class="messages" id="messages"></div>
      <div class="quick">
        <button type="button" data-q="NovaDesk 有哪些核心模块？">产品</button>
        <button type="button" data-q="登录失败怎么排查？">登录</button>
        <button type="button" data-q="退款政策是什么？">退款</button>
        <button type="button" data-q="Enterprise 的 SLA 首响多久？">SLA</button>
        <button type="button" data-q="转人工，登录一直失败">转人工</button>
      </div>
      <form id="chatForm" class="composer">
        <input id="chatInput" type="text" placeholder="问知识库里的问题" autocomplete="off" required />
        <button type="submit" id="sendBtn">发送</button>
      </form>
    </section>
  </main>

  <main id="tab-tickets" class="page hidden">
    <h1>工单</h1>
    <p class="dim">转人工会记在这里。</p>
    <ul class="tickets" id="ticketList"></ul>
  </main>

  <main id="tab-debug" class="page hidden">
    <p class="dim">检索对比和评测，平时对话页用不到。</p>
    <div class="debug-grid">
      <section>
        <h2>库</h2>
        <p id="statsLine">—</p>
        <div id="catList"></div>
        <ul id="entityList"></ul>
      </section>
      <section>
        <h2>向量 vs 图谱</h2>
        <form id="compareForm">
          <input id="compareQuery" placeholder="例如：Enterprise SLA" required />
          <button type="submit">对比</button>
        </form>
        <pre id="compareOut"> </pre>
      </section>
      <section>
        <h2>评测</h2>
        <button type="button" id="evalBtn">跑一遍</button>
        <pre id="evalOut"> </pre>
      </section>
      <section>
        <h2>补一条知识</h2>
        <form id="ingestForm">
          <input name="title" placeholder="标题" required />
          <select name="category">
              <option value="product">产品</option>
              <option value="support">排障</option>
              <option value="billing">退款</option>
              <option value="sla">SLA</option>
          </select>
          <textarea name="content" rows="4" required></textarea>
          <input name="adminToken" id="adminToken" placeholder="管理员 token，没有就空着" />
          <button type="submit">写入</button>
          <p class="dim" id="ingestHint"></p>
        </form>
      </section>
    </div>
  </main>
  <script src="/assets/app.js"></script>
</body>
</html>
