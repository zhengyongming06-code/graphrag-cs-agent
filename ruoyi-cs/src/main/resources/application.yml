server:
  port: 8088

spring:
  application:
    name: ruoyi-cs
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  datasource:
    url: jdbc:h2:file:./data/ruoyi-cs;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

python:
  base-url: http://127.0.0.1:8000
  service-token: change-me-in-production

jwt:
  secret: ruoyi-cs-demo-secret-change-me-32bytes!!
  expire-hours: 12
